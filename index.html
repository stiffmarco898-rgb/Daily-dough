<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flour & Butter - Katalog Pastry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF7F2; color: #4A3B32; }
    .font-serif-custom { font-family: 'Playfair Display', serif; }

    /* Efek Animasi Membal Tombol */
    @keyframes btnPop {
      0% { transform: scale(1); }
      40% { transform: scale(0.9); }
      70% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .animate-pop {
      animation: btnPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Efek Animasi Bounce Tombol Keranjang */
    @keyframes cartBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .animate-cart-bounce {
      animation: cartBounce 0.4s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen pb-20 relative">

  <!-- Header -->
  <header class="bg-[#FFFDF9] border-b border-[#E6DFD5] sticky top-0 z-10 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="font-serif-custom text-2xl font-bold text-[#3D2E24]">Flour & Butter</h1>
        <p class="text-xs text-[#8C7A6B]">Artisan Pastry & Salt Bread</p>
      </div>
      <div id="cartBtnContainer"></div>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="bg-[#F3ECE0] py-8 px-4 text-center border-b border-[#E6DFD5]">
    <h2 class="font-serif-custom text-3xl font-bold text-[#3D2E24] mb-2">Freshly Baked Every Day</h2>
    <p class="text-sm text-[#6E5D4F] max-w-md mx-auto">Nikmati kelembutan Salt Bread dan aneka pastry olahan bahan premium pilihan.</p>
  </section>

  <!-- Filter & Search -->
  <div class="max-w-4xl mx-auto px-4 mt-6">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Cari menu salt bread favoritmu..." 
      oninput="handleSearch()"
      class="w-full p-3 rounded-xl border border-[#D9CEC1] bg-white text-sm focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]"
    />
    <div id="categoryContainer" class="flex gap-2 overflow-x-auto mt-4 pb-2 scrollbar-none"></div>
  </div>

  <!-- Menu Grid -->
  <main class="max-w-4xl mx-auto px-4 mt-6">
    <div id="menuGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <p class="text-center text-sm text-[#8C7A6B] py-10 col-span-full">Memuat katalog menu...</p>
    </div>
  </main>

  <!-- OVERLAY & MODAL KERANJANG -->
  <div id="cartOverlay" style="display:none;" class="fixed inset-0 bg-black/50 z-50 justify-end">
    <div class="bg-[#FAF7F2] w-full max-w-md h-full flex flex-col shadow-2xl ml-auto">
      <!-- Header Pop-up -->
      <div class="p-4 bg-[#FFFDF9] border-b border-[#E6DFD5] flex justify-between items-center">
        <div>
          <h3 class="font-serif-custom font-bold text-lg text-[#3D2E24]">Keranjang Pesanan</h3>
          <p class="text-xs text-[#8C7A6B]">Lengkapi data diri sebelum checkout</p>
        </div>
        <button onclick="closeCartModal()" class="text-[#8C7A6B] hover:text-[#3D2E24] text-xl font-bold p-2">✕</button>
      </div>

      <!-- Content Area -->
      <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
        <!-- List Produk -->
        <div id="cartItemsList" class="flex flex-col gap-3"></div>

        <!-- Form Data Pemesan -->
        <div id="customerFormSection" class="bg-white p-4 rounded-xl border border-[#E6DFD5] flex flex-col gap-3">
          <h4 class="font-bold text-xs text-[#3D2E24] uppercase tracking-wider">Data Pemesan</h4>
          <div>
            <label class="block text-xs font-semibold text-[#5C4033] mb-1">Nama Pemesan <span class="text-red-500">*</span></label>
            <input 
              type="text" 
              id="customerNameInput" 
              placeholder="Ketik nama kamu di sini..." 
              class="w-full p-2.5 rounded-lg border border-[#D9CEC1] text-xs focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-[#5C4033] mb-1">Catatan Tambahan (Opsional)</label>
            <textarea 
              id="customerNoteInput" 
              rows="2" 
              placeholder="Contoh: Ambil jam 2 siang / Kemasan dipisah..." 
              class="w-full p-2.5 rounded-lg border border-[#D9CEC1] text-xs focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]"
            ></textarea>
          </div>
        </div>
      </div>

      <!-- Footer Pop-up -->
      <div class="p-4 bg-[#FFFDF9] border-t border-[#E6DFD5]">
        <div class="flex justify-between items-center mb-4">
          <span class="text-sm text-[#7A695A] font-medium">Total Estimasi</span>
          <span id="cartTotalPrice" class="text-lg font-bold text-[#5C4033]">Rp 0</span>
        </div>
        <button onclick="sendCartWA()" class="w-full bg-[#25D366] text-white py-3 rounded-xl font-bold text-sm shadow-md hover:bg-[#1EBE57] transition-all flex items-center justify-center gap-2">
          💬 Pesan via WhatsApp
        </button>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzrrbr2QRQFvzos5Q7ZsAZfrzPe1JZq-2S9RJksOc5oZd09cy2TpxfjN5uAdTyNwMEoqw/exec";
    const WA_NUMBER = "6281909008736";

    let menuItems = [];
    let cart = [];
    let selectedCategory = "Semua";
    let searchQuery = "";

    async function init() {
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          menuItems = data;
        }
      } catch (err) {
        console.error("Gagal mengambil data dari Google Sheets:", err);
      }
      renderCategories();
      renderMenu();
    }

    function parsePrice(val) {
      if (typeof val === 'number') return val;
      if (!val) return 0;
      const clean = String(val).replace(/[^0-9]/g, '');
      return parseInt(clean, 10) || 0;
    }

    function getFullName(item) {
      const category = item.KATEGORI || item.category || "Pastry";
      const name = item.NAMA || item.name || "Original";
      return `${category} - ${name}`;
    }

    function renderCategories() {
      const cats = ["Semua", ...new Set(menuItems.map(i => i.KATEGORI || i.category).filter(Boolean))];
      const container = document.getElementById("categoryContainer");
      container.innerHTML = cats.map(cat => `
        <button 
          onclick="selectCategory('${cat}')"
          class="px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${selectedCategory === cat ? 'bg-[#5C4033] text-white' : 'bg-white border border-[#D9CEC1] text-[#5C4033]'}"
        >
          ${cat}
        </button>
      `).join("");
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      renderMenu();
    }

    function handleSearch() {
      searchQuery = document.getElementById("searchInput").value;
      renderMenu();
    }

    // PENGELOLAAN KERANJANG DENGAN ANIMASI
    function addToCart(id, btnElement) {
      const item = menuItems.find(i => String(i.ID || i.id) === String(id));
      if (!item) return;

      const existing = cart.find(i => String(i.id) === String(id));
      if (existing) {
        existing.qty += 1;
      } else {
        const fullName = getFullName(item);
        const price = parsePrice(item.HARGA || item.price);
        const image = item.FOTO || item.image || "https://images.unsplash.com/photo-1589367920969-ab8e050bbb04?w=500";
        cart.push({ id: String(id), name: fullName, price, image, qty: 1 });
      }

      // Animasi feedback tombol
      if (btnElement) {
        btnElement.classList.add("animate-pop", "bg-emerald-600", "text-white");
        btnElement.classList.remove("bg-[#F3ECE0]", "text-[#5C4033]");
        const originalText = btnElement.innerText;
        btnElement.innerText = "✓ Ditambahkan";

        setTimeout(() => {
          btnElement.classList.remove("animate-pop", "bg-emerald-600", "text-white");
          btnElement.classList.add("bg-[#F3ECE0]", "text-[#5C4033]");
          btnElement.innerText = originalText;
        }, 1000);
      }

      renderCartBtn(true);
    }

    function updateQty(id, change) {
      const item = cart.find(i => String(i.id) === String(id));
      if (!item) return;

      item.qty += change;
      if (item.qty <= 0) {
        cart = cart.filter(i => String(i.id) !== String(id));
      }
      
      renderCartBtn(false);
      renderCartModalContent();

      if (cart.length === 0) {
        closeCartModal();
      }
    }

    function renderCartBtn(shouldAnimate = false) {
      const container = document.getElementById("cartBtnContainer");
      const totalItems = cart.reduce((a, b) => a + b.qty, 0);

      if (totalItems > 0) {
        container.innerHTML = `
          <button 
            id="mainCartBtn"
            onclick="openCartModal()" 
            class="bg-[#5C4033] text-white px-4 py-2 rounded-full text-xs font-semibold flex items-center gap-2 shadow-md hover:bg-[#4A3328] transition-all ${shouldAnimate ? 'animate-cart-bounce' : ''}"
          >
            🛒 Keranjang (${totalItems})
          </button>
        `;
      } else {
        container.innerHTML = "";
      }
    }

    function openCartModal() {
      renderCartModalContent();
      const modal = document.getElementById("cartOverlay");
      modal.style.display = "flex";
    }

    function closeCartModal() {
      const modal = document.getElementById("cartOverlay");
      modal.style.display = "none";
    }

    function renderCartModalContent() {
      const listContainer = document.getElementById("cartItemsList");
      const totalPriceContainer = document.getElementById("cartTotalPrice");
      const formSection = document.getElementById("customerFormSection");

      if (cart.length === 0) {
        listContainer.innerHTML = `<p class="text-center text-sm text-[#8C7A6B] py-10">Keranjang masih kosong.</p>`;
        totalPriceContainer.innerText = "Rp 0";
        if (formSection) formSection.style.display = "none";
        return;
      }

      if (formSection) formSection.style.display = "flex";

      let total = 0;
      listContainer.innerHTML = cart.map(item => {
        const subtotal = item.price * item.qty;
        total += subtotal;
        return `
          <div class="bg-white p-3 rounded-xl border border-[#E6DFD5] flex items-center gap-3">
            <img src="${item.image}" alt="${item.name}" class="w-14 h-14 object-cover rounded-lg flex-shrink-0" />
            <div class="flex-1">
              <h4 class="font-bold text-xs text-[#3D2E24]">${item.name}</h4>
              <p class="text-xs text-[#5C4033] font-semibold mt-0.5">Rp ${subtotal.toLocaleString('id-ID')}</p>
            </div>
            <div class="flex items-center gap-2 bg-[#F3ECE0] rounded-lg px-2 py-1">
              <button onclick="updateQty('${item.id}', -1)" class="w-6 h-6 flex items-center justify-center text-xs font-bold text-[#5C4033] bg-white rounded shadow-sm hover:bg-[#E6DFD5]">-</button>
              <span class="text-xs font-bold text-[#3D2E24] w-4 text-center">${item.qty}</span>
              <button onclick="updateQty('${item.id}', 1)" class="w-6 h-6 flex items-center justify-center text-xs font-bold text-[#5C4033] bg-white rounded shadow-sm hover:bg-[#E6DFD5]">+</button>
            </div>
          </div>
        `;
      }).join("");

      totalPriceContainer.innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }

    function sendDirectWA(id) {
      const item = menuItems.find(i => String(i.ID || i.id) === String(id));
      if (!item) return;
      const fullName = getFullName(item);
      const price = parsePrice(item.HARGA || item.price);
      
      const customerName = prompt("Masukkan Nama Kamu untuk memesan:");
      if (!customerName || customerName.trim() === "") {
        alert("Nama wajib diisi untuk melakukan pemesanan.");
        return;
      }

      let text = `Halo, saya *${customerName.trim()}* ingin memesan:\n\n`;
      text += `1. *${fullName}* (1x) = Rp ${price.toLocaleString('id-ID')}\n\n`;
      text += `Apakah produk ini tersedia?`;
      
      window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
    }

    function sendCartWA() {
      if (cart.length === 0) return;

      const customerNameInput = document.getElementById("customerNameInput");
      const customerNoteInput = document.getElementById("customerNoteInput");
      
      const name = customerNameInput ? customerNameInput.value.trim() : "";
      const note = customerNoteInput ? customerNoteInput.value.trim() : "";

      if (!name) {
        alert("Mohon isi Nama Kamu terlebih dahulu sebelum pesan.");
        customerNameInput.focus();
        return;
      }

      let text = `Halo, saya *${name}* ingin memesan menu berikut:\n\n`;
      let total = 0;

      cart.forEach((item, idx) => {
        const subtotal = item.price * item.qty;
        total += subtotal;
        text += `${idx + 1}. *${item.name}* (${item.qty}x) = Rp ${subtotal.toLocaleString('id-ID')}\n`;
      });

      text += `\n*Total Estimasi: Rp ${total.toLocaleString('id-ID')}*`;

      if (note) {
        text += `\n\n*Catatan:* ${note}`;
      }

      window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
    }

    function renderMenu() {
      const grid = document.getElementById("menuGrid");
      const filtered = menuItems.filter(item => {
        const name = item.NAMA || item.name || "";
        const category = item.KATEGORI || item.category || "";
        
        const matchCat = selectedCategory === "Semua" || category === selectedCategory;
        const matchSearch = name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p class="text-center text-sm text-[#8C7A6B] py-10 col-span-full">Menu tidak ditemukan.</p>`;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const id = item.ID || item.id;
        const displayName = item.NAMA || item.name || "Original";
        const priceNum = parsePrice(item.HARGA || item.price);
        const priceFormatted = priceNum.toLocaleString('id-ID');
        const image = item.FOTO || item.image || "https://images.unsplash.com/photo-1589367920969-ab8e050bbb04?w=500";
        const isOut = String(item.STATUS || item.isAvailable).toUpperCase() === "FALSE" || String(item.STATUS).toLowerCase() === "habis";

        return `
          <div class="bg-white rounded-2xl p-4 border border-[#E6DFD5] shadow-sm flex gap-4">
            <img src="${image}" alt="${displayName}" class="w-24 h-24 object-cover rounded-xl bg-gray-100 flex-shrink-0" />
            <div class="flex-1 flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-start">
                  <h3 class="font-bold text-[#3D2E24] text-base">${displayName}</h3>
                  ${isOut ? `<span class="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded font-bold">Habis</span>` : ''}
                </div>
                <p class="text-xs text-[#7A695A] mt-1">${item.KATEGORI || 'Salt Bread'}</p>
              </div>
              <div class="flex items-center justify-between mt-3">
                <span class="font-bold text-sm text-[#5C4033]">Rp ${priceFormatted}</span>
                <div class="flex gap-1">
                  <button onclick="addToCart('${id}', this)" class="bg-[#F3ECE0] text-[#5C4033] px-2.5 py-1.5 rounded-lg text-xs font-semibold hover:bg-[#E6DFD5] transition-all">
                    + Keranjang
                  </button>
                  <button onclick="sendDirectWA('${id}')" class="bg-[#5C4033] text-white px-3 py-1.5 rounded-lg text-xs font-semibold">
                    Pesan
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    init();
  </script>
</body>
</html>

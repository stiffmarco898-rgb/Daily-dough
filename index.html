<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flour & Butter - Katalog Pastry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF7F2; color: #4A3B32; }
    .font-serif-custom { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-[#FFFDF9] border-b border-[#E6DFD5] sticky top-0 z-10 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="font-serif-custom text-2xl font-bold text-[#3D2E24]">Flour & Butter</h1>
        <p class="text-xs text-[#8C7A6B]">Artisan Pastry & Salt Bread</p>
      </div>
      <div id="cartBtnContainer"></div>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="bg-[#F3ECE0] py-8 px-4 text-center border-b border-[#E6DFD5]">
    <h2 class="font-serif-custom text-3xl font-bold text-[#3D2E24] mb-2">Freshly Baked Every Day</h2>
    <p class="text-sm text-[#6E5D4F] max-w-md mx-auto">Nikmati kelembutan Salt Bread dan aneka pastry olahan bahan premium pilihan.</p>
  </section>

  <!-- Filter & Search -->
  <div class="max-w-4xl mx-auto px-4 mt-6">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Cari menu salt bread favoritmu..." 
      oninput="handleSearch()"
      class="w-full p-3 rounded-xl border border-[#D9CEC1] bg-white text-sm focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]"
    />
    <div id="categoryContainer" class="flex gap-2 overflow-x-auto mt-4 pb-2 scrollbar-none"></div>
  </div>

  <!-- Menu Grid -->
  <main class="max-w-4xl mx-auto px-4 mt-6">
    <div id="menuGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <p class="text-center text-sm text-[#8C7A6B] py-10 col-span-full">Memuat katalog menu...</p>
    </div>
  </main>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzrrbr2QRQFvzos5Q7ZsAZfrzPe1JZq-2S9RJksOc5oZd09cy2TpxfjN5uAdTyNwMEoqw/exec";
    const WA_NUMBER = "6281909008736";

    let menuItems = [];
    let cart = [];
    let selectedCategory = "Semua";
    let searchQuery = "";

    async function init() {
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          menuItems = data;
        }
      } catch (err) {
        console.error("Gagal mengambil data dari Google Sheets:", err);
      }
      renderCategories();
      renderMenu();
    }

    // Membersihkan format string harga seperti "Rp9,000" atau "12.500" menjadi angka murni
    function parsePrice(val) {
      if (typeof val === 'number') return val;
      if (!val) return 0;
      const clean = String(val).replace(/[^0-9]/g, '');
      return parseInt(clean, 10) || 0;
    }

    function renderCategories() {
      const cats = ["Semua", ...new Set(menuItems.map(i => i.KATEGORI || i.category).filter(Boolean))];
      const container = document.getElementById("categoryContainer");
      container.innerHTML = cats.map(cat => `
        <button 
          onclick="selectCategory('${cat}')"
          class="px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${selectedCategory === cat ? 'bg-[#5C4033] text-white' : 'bg-white border border-[#D9CEC1] text-[#5C4033]'}"
        >
          ${cat}
        </button>
      `).join("");
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      renderMenu();
    }

    function handleSearch() {
      searchQuery = document.getElementById("searchInput").value;
      renderMenu();
    }

    function addToCart(id) {
      const item = menuItems.find(i => String(i.ID || i.id) === String(id));
      if (!item) return;
      
      const existing = cart.find(i => String(i.id) === String(id));
      if (existing) {
        existing.qty += 1;
      } else {
        const name = item.NAMA || item.name || "Produk";
        const price = parsePrice(item.HARGA || item.price);
        cart.push({ id: String(id), name, price, qty: 1 });
      }
      renderCartBtn();
    }

    function renderCartBtn() {
      const container = document.getElementById("cartBtnContainer");
      const totalItems = cart.reduce((a, b) => a + b.qty, 0);
      if (totalItems > 0) {
        container.innerHTML = `
          <button onclick="sendCartWA()" class="bg-[#5C4033] text-white px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2 shadow-md">
            🛒 Pesan (${totalItems})
          </button>
        `;
      } else {
        container.innerHTML = "";
      }
    }

    function sendDirectWA(id) {
      const item = menuItems.find(i => String(i.ID || i.id) === String(id));
      if (!item) return;
      const name = item.NAMA || item.name || "Produk";
      const price = parsePrice(item.HARGA || item.price);
      const text = `Halo, saya ingin memesan *${name}* dengan harga Rp ${price.toLocaleString('id-ID')}. Apakah produk ini tersedia?`;
      window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
    }

    function sendCartWA() {
      if (cart.length === 0) return;
      let text = "Halo, saya ingin pesan menu berikut:\n\n";
      let total = 0;
      cart.forEach((item, idx) => {
        const subtotal = item.price * item.qty;
        total += subtotal;
        text += `${idx + 1}. ${item.name} x${item.qty} = Rp ${subtotal.toLocaleString('id-ID')}\n`;
      });
      text += `\n*Total Estimasi: Rp ${total.toLocaleString('id-ID')}*`;
      window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
    }

    function renderMenu() {
      const grid = document.getElementById("menuGrid");
      const filtered = menuItems.filter(item => {
        const name = item.NAMA || item.name || "";
        const category = item.KATEGORI || item.category || "";
        
        const matchCat = selectedCategory === "Semua" || category === selectedCategory;
        const matchSearch = name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p class="text-center text-sm text-[#8C7A6B] py-10 col-span-full">Menu tidak ditemukan.</p>`;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const id = item.ID || item.id;
        const name = item.NAMA || item.name || "Salt Bread";
        const priceNum = parsePrice(item.HARGA || item.price);
        const priceFormatted = priceNum.toLocaleString('id-ID');
        const image = item.FOTO || item.image || "https://images.unsplash.com/photo-1589367920969-ab8e050bbb04?w=500";
        const isOut = String(item.STATUS || item.isAvailable).toUpperCase() === "FALSE" || String(item.STATUS).toLowerCase() === "habis";

        return `
          <div class="bg-white rounded-2xl p-4 border border-[#E6DFD5] shadow-sm flex gap-4">
            <img src="${image}" alt="${name}" class="w-24 h-24 object-cover rounded-xl bg-gray-100 flex-shrink-0" />
            <div class="flex-1 flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-start">
                  <h3 class="font-bold text-[#3D2E24] text-base">${name}</h3>
                  ${isOut ? `<span class="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded font-bold">Habis</span>` : ''}
                </div>
                <p class="text-xs text-[#7A695A] mt-1">Salt Bread Premium</p>
              </div>
              <div class="flex items-center justify-between mt-3">
                <span class="font-bold text-sm text-[#5C4033]">Rp ${priceFormatted}</span>
                <div class="flex gap-1">
                  <button onclick="addToCart('${id}')" class="bg-[#F3ECE0] text-[#5C4033] px-2.5 py-1.5 rounded-lg text-xs font-semibold hover:bg-[#E6DFD5]">
                    + Keranjang
                  </button>
                  <button onclick="sendDirectWA('${id}')" class="bg-[#5C4033] text-white px-3 py-1.5 rounded-lg text-xs font-semibold">
                    Pesan
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    init();
  </script>
</body>
</html>
